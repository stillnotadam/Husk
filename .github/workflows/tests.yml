name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/husk/ --ignore-missing-imports

      - name: Run test suite with coverage
        run: |
          python3 -m pytest tests/ --cov=src/husk --cov-report=term-missing -v

      - name: Regression check against real malicious samples
        run: |
          python3 -c "
          import json, tempfile, os
          from husk.skill_scanner import scan_skill_file
          caught = 0
          with open('validation/real_malicious_samples.jsonl') as f:
              lines = f.readlines()
          for line in lines:
              record = json.loads(line)
              with tempfile.NamedTemporaryFile(mode='w', suffix='.md', delete=False) as tmp:
                  tmp.write(record['content']); tmp_path = tmp.name
              result = scan_skill_file(tmp_path)
              os.unlink(tmp_path)
              if result['verdict'] == 'FLAGGED':
                  caught += 1
          print(f'{caught}/{len(lines)} real malicious samples caught')
          assert caught == len(lines), 'Regression: real malicious sample detection dropped!'
          "
